<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Módulo de Registro - I.E. 7224</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<body>

    <!-- Barra superior (móvil) -->
        {% include "asistencia/_sidebar.html" with activo="registro" %}

    <main class="contenido">
        <div class="pagina-cab">
            <div>
                <h1>Registro de ingreso</h1>
                <p>Módulo de puerta</p>
            </div>
        </div>

        <div class="registro-grid">
            <!-- Panel Izquierdo: Lector -->
            <section class="panel">
                <h2>Registrar Ingreso</h2>
                <p class="ayuda">Digite manualmente el DNI del estudiante</p>

                <input type="text" id="input-dni" class="campo-dni" inputmode="numeric" placeholder="74852316" autofocus autocomplete="off">
                <p id="mensaje-sistema" class="mensaje" role="alert"></p>
            </section>

            <!-- Panel Derecho: Verificación Visual -->
            <section class="panel" id="panel-verificacion">
                <h2>Verificación del estudiante</h2>
                <p class="ayuda">Confirme que los datos coinciden con el alumno presente.</p>

                <div class="alumno">
                    <img id="foto-estudiante" src="" alt="Foto del estudiante">
                    <div>
                        <h3 id="nombre-estudiante"></h3>
                        <p id="grado-estudiante"></p>
                    </div>
                </div>

                <div id="botones-accion" class="acciones hidden">
                    <button class="btn btn-confirm" onclick="enviarRegistro('confirmar')">✔ Asistencia</button>
                    <button class="btn btn-falta" onclick="enviarRegistro('falta')">⚠ Poner falta</button>
                    <button class="btn btn-cancel" onclick="enviarRegistro('anular')">✖ Anular / limpiar</button>
                </div>
            </section>
        </div>
    </main>

    <script>
        const inputDni = document.getElementById('input-dni');
        let dniActual = '';

        inputDni.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                dniActual = this.value;
                buscarEstudiante(dniActual);
                this.value = '';
            }
        });

        function buscarEstudiante(dni) {
            fetch(`/api/buscar_estudiante/?dni=${encodeURIComponent(dni)}`)
                .then(response => response.json())
                .then(data => {
                    const mensaje = document.getElementById('mensaje-sistema');
                    const foto = document.getElementById('foto-estudiante');
                    const botones = document.getElementById('botones-accion');

                    if (data.encontrado) {
                        if (data.ya_ingreso) {
                            mensaje.innerText = "Este estudiante ya registró su asistencia o falta hoy.";
                            botones.classList.add('hidden');
                        } else {
                            mensaje.innerText = "";
                            document.getElementById('nombre-estudiante').innerText = data.nombre_completo;
                            document.getElementById('grado-estudiante').innerText = "Grado y sección: " + data.grado_seccion;
                            foto.src = data.foto_url;
                            foto.style.display = "block";
                            botones.classList.remove('hidden');
                        }
                    } else {
                        mensaje.innerText = data.mensaje;
                        limpiarPantalla();
                    }
                })
                .catch(() => {
                    document.getElementById('mensaje-sistema').innerText =
                        "No se pudo consultar al estudiante.";
                    limpiarPantalla();
                });
        }

        function enviarRegistro(accion) {
            // Si presiona anular, no se envía nada al backend, solo se limpia la UI
            if (accion === 'anular') {
                limpiarPantalla();
                return;
            }

            fetch('/api/confirmar_ingreso/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    dni: dniActual,
                    accion: accion,
                    metodo: 'DNI'
                })
            })
            .then(async response => {
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.mensaje || "No se pudo guardar el registro.");
                }
                return data;
            })
            .then(data => {
                alert(`Registro exitoso. Estado asignado: ${data.estado}`);
                limpiarPantalla();
            })
            .catch(error => {
                document.getElementById('mensaje-sistema').innerText = error.message;
            });
        }

        function limpiarPantalla() {
            document.getElementById('foto-estudiante').style.display = "none";
            document.getElementById('botones-accion').classList.add('hidden');
            document.getElementById('nombre-estudiante').innerText = "";
            document.getElementById('grado-estudiante').innerText = "";
            inputDni.value = "";
            inputDni.focus();
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
