<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - I.E. 7224</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'global.css' %}">
</head>
<body class="login-page">
    <main class="login-card panel">
        <h1>I.E. 7224</h1>
        <p class="ayuda">Inicia sesión para acceder a la gestión y los reportes.</p>
        {% if form.errors %}
        <p class="mensaje">Usuario o contraseña incorrectos.</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            <label class="etiqueta" for="id_username">Usuario</label>
            <input class="campo-formulario" type="text" name="username" id="id_username" autocomplete="username" required autofocus>
            <label class="etiqueta" for="id_password">Contraseña</label>
            <input class="campo-formulario" type="password" name="password" id="id_password" autocomplete="current-password" required>
            <button class="btn btn-filtrar btn-ancho" type="submit">Iniciar sesión</button>
        </form>
        <a class="enlace-regreso" href="{% url 'pantalla_registro' %}">Volver al registro de ingreso</a>
    </main>
</body>
</html>
